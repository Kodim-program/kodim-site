<div
    style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;border-top:5px solid #01b3a7;background:#ffffff;padding:28px;color:#151515">
    <div style="font-size:22px;font-weight:700;color:#01b3a7;text-align:center">KODiM</div>
    <h2 style="text-align:center;margin:12px 0 18px">Відновлення пароля</h2>
    <p>Ви (або хтось інший) запросили відновлення пароля для акаунта <b>{{ user.get_username }}</b>.</p>
    <p style="text-align:center;margin:26px 0">
        <a href="{{ protocol }}://{{ domain }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}"
            style="background:#01b3a7;color:#ffffff;text-decoration:none;padding:14px 28px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px">
            Створити новий пароль
        </a>
    </p>
    <p style="font-size:12px;color:#9b9b9b">Якщо це були не ви — просто проігноруйте лист, пароль залишиться без змін.
    </p>
</div>
